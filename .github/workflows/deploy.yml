name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/smart-comic-game:latest
          ${{ secrets.DOCKER_USERNAME }}/smart-comic-game:${{ github.sha }}
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/smart-comic-game:latest
          docker stop smart-comic-game || true
          docker rm smart-comic-game || true
          docker run -d \
            --name smart-comic-game \
            --restart unless-stopped \
            -p 5000:5000 \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            ${{ secrets.DOCKER_USERNAME }}/smart-comic-game:latest
          docker image prune -f
